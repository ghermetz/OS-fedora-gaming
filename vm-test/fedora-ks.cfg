# ============================================================================
#  fedora-gaming - vm-test/fedora-ks.cfg
#  Kickstart de la VM de test, utilise par test-vm.ps1 / test-vm.sh via
#  "VBoxManage unattended install --script-template".
#  Remplace le fedora_ks.cfg livre avec VirtualBox (obsolete : commandes
#  install/auth supprimees d'Anaconda). Les @@VBOX_...@@ sont remplis par VBox.
#  Necessite l'ISO netinstall "Everything" (les ISO Live ne sont pas
#  supportees en unattended) : les paquets viennent des miroirs Fedora.
# ============================================================================
text
lang fr_FR.UTF-8
keyboard fr
timezone @@VBOX_INSERT_TIME_ZONE_UX@@ --utc

network --bootproto=dhcp --activate --hostname=@@VBOX_INSERT_HOSTNAME_FQDN_SH@@
url --mirrorlist=https://mirrors.fedoraproject.org/mirrorlist?repo=fedora-$releasever&arch=x86_64
repo --name=updates --mirrorlist=https://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f$releasever&arch=x86_64

firewall --enabled --service=ssh
selinux --enforcing
services --enabled=sshd

zerombr
clearpart --all --initlabel
autopart --type=btrfs
bootloader --timeout=3

rootpw --lock
user --name=@@VBOX_INSERT_USER_LOGIN_SH@@ --groups=wheel --password=@@VBOX_INSERT_USER_PASSWORD_SH@@ --plaintext

firstboot --disable
reboot --eject

%packages
@^kde-desktop-environment
openssh-server
tar
-initial-setup
-initial-setup-gui
%end

%post --log=/root/ks-post.log
systemctl enable sshd
systemctl set-default graphical.target
%end
