# fedora-gaming — lanceur d'applications (bouton « Démarrer », Super+Espace)
# S'ouvre en bas à gauche, au-dessus du bouton Démarrer, comme sous Windows.
[main]
font=Inter:size=12,Noto Sans:size=12
icon-theme=Papirus-Dark
terminal=konsole
prompt="🔎  "
placeholder=Rechercher une application…
anchor=bottom-left
x-margin=6
y-margin=54
width=38
lines=14
line-height=30
horizontal-pad=16
vertical-pad=12
inner-pad=8
image-size-ratio=0.6
layer=overlay

[colors]
background=1e2026f2
text=e8e8ecff
prompt=15a6f0ff
placeholder=8a8a96ff
input=ffffffff
match=5ec8ffff
selection=15a6f0cc
selection-text=ffffffff
selection-match=ffffffff
border=ffffff22

[border]
width=1
radius=14
