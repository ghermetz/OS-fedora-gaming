# fedora-gaming — lanceur d'applications (bouton « Démarrer », Super+Espace)
# S'ouvre en bas à gauche, au-dessus du bouton Démarrer, comme sous Windows.
[main]
font=Noto Sans:size=12
icon-theme=breeze
terminal=konsole
prompt="🔎  "
placeholder=Rechercher une application…
anchor=bottom-left
x-margin=6
y-margin=46
width=38
lines=14
line-height=30
horizontal-pad=16
vertical-pad=12
inner-pad=8
image-size-ratio=0.6
layer=overlay

[colors]
background=16161af0
text=e8e8ecff
prompt=e50914ff
placeholder=8a8a96ff
input=ffffffff
match=ff5c63ff
selection=e50914cc
selection-text=ffffffff
selection-match=ffffffff
border=e50914ff

[border]
width=1
radius=10
