# fedora-gaming — notifications (si SwayNotificationCenter n'est pas installé)
# En bas à droite, au-dessus de la barre des tâches, comme sous Windows.
anchor=bottom-right
margin=10,10,58,10
width=380
padding=14
border-size=1
border-radius=14
border-color=#ffffff22
background-color=#1e2026f2
text-color=#e8e8ec
progress-color=over #15a6f0
font=Inter 11
icon-path=/usr/share/icons/Papirus-Dark
max-icon-size=48
default-timeout=6000
layer=overlay

[app-name=Volume]
anchor=bottom-center
width=260
default-timeout=1500
